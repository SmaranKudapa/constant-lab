<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Town Trial</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="results.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="labels"></div>

<!-- Landing -->
<section id="landing">
  <div class="landing-card">
    <div class="logo">TOWN<br>TRIAL</div>
    <p class="tag">Simulator for local policy ideas</p>
    <form id="city-form" autocomplete="off">
      <input id="city-input" type="text" maxlength="40" placeholder="Enter a city..." spellcheck="false">
      <button type="submit" class="btn btn-go">BUILD TOWN &#9654;</button>
    </form>
    <div class="examples">
      try: <a data-city="Waitsfield, VT">Waitsfield, VT</a> &middot;
      <a data-city="Evart, MI">Evart, MI</a> &middot;
      <a data-city="Kiowa, CO">Kiowa, CO</a>
    </div>
  </div>
</section>

<!-- In-town HUD -->
<section id="hud" class="hidden">
  <div id="topbar">
    <div class="panel town-badge" title="Map data © OpenStreetMap contributors">
      <div id="town-name">-</div>
      <div id="clock">Mon 08:00</div>
    </div>
    <div class="panel speed">
      <button class="btn small" data-speed="0" title="Pause">II</button>
      <button class="btn small active" data-speed="1">1x</button>
      <button class="btn small" data-speed="4">4x</button>
      <button class="btn small" data-speed="16">16x</button>
    </div>
    <div id="town-stats" class="panel stats hidden">
      <span title="Real population of the town"><i>RESIDENTS</i><b id="st-pop">-</b></span>
      <span title="Residents the simulator models (each stands for a share of the real population)"><i>SIMULATED</i><b id="st-sim">-</b></span>
      <span title="Town budget from a verified source (Exa Dude's town profile)"><i>TOWN BUDGET</i><b id="st-bud">-</b></span>
    </div>
    <div id="mode-badge" class="panel mode hidden" aria-hidden="true">-</div>
    <div id="status-chip" class="panel status hidden"><i class="spin"></i><span id="status-text"></span></div>
    <div class="spacer"></div>
    <div class="panel views">
      <button class="btn small active" id="view-town">TOWN</button>
      <button class="btn small" id="view-heaven">OLYMPUS &#8593;</button>
    </div>
    <div class="trials-wrap"><button class="btn small" id="trials-btn" title="Results of past trials">TRIALS</button><div id="trials-menu" class="panel hidden"></div></div>
    <button class="btn small" id="toggle-sound" title="Sound">♪</button>
    <button class="btn small" id="toggle-pix" title="Toggle pixel art (off = full resolution, heavier to draw)">PX</button>
    <button class="btn small" id="toggle-panel" title="Show/hide the side panel">PANEL</button>
  </div>

  <div id="demo-banner">DEMO</div>

  <!-- Side panel -->
  <aside id="side" class="panel">
    <div class="tabs">
      <button class="tab active" data-tab="log">LOG</button>
      <button class="tab" data-tab="exp">EXPERIMENTS</button>
      <button class="tab" data-tab="aud">AUDIENCES</button>
    </div>
    <div class="tab-body" id="tab-log"><div id="log"></div></div>
    <div class="tab-body hidden" id="tab-exp"></div>
    <div class="tab-body hidden" id="tab-aud"></div>
  </aside>

  <!-- Selection (left) -->
  <aside id="selected" class="panel hidden"></aside>

  <!-- Run viewer -->
  <div id="runbar" class="panel hidden">
    <button class="btn small" id="run-prev">&#9664;</button>
    <div id="run-label">-</div>
    <button class="btn small" id="run-next">&#9654;</button>
  </div>

  <!-- Prompt -->
  <form id="prompt-form" class="panel" autocomplete="off">
    <div class="chips">
      <button type="button" class="chip" data-prompt="Extend library hours two evenings a week to reach residents who work during the day" title="Extend library hours two evenings a week to reach residents who work during the day">Service trial</button>
      <button type="button" class="chip" data-prompt="Will working parents hear about the new library hours if we only post the notice online?" title="Will working parents hear about the new library hours if we only post the notice online?">Perception trial</button>
      <button type="button" class="chip" data-prompt="Make the town's public places more accessible for students" title="Make the town's public places more accessible for students">Town trial</button>
    </div>
    <div class="prompt-row">
      <input id="prompt-input" type="text" placeholder="What policy idea do you want to test?" spellcheck="false">
      <button type="submit" class="btn btn-go">RUN TRIAL &#9654;</button>
    </div>
  </form>
</section>

<div id="toast" class="hidden"></div>
<div id="loading" class="hidden"><div class="ld-card panel"><div class="ld-spin"></div><div id="ld-title">Building the town</div><div id="ld-sub"></div></div></div>
<div id="celebrate-banner" class="hidden"><span>BEST POLICY FOUND!</span></div>
<div id="results" class="hidden"></div>
<div id="hover-tip" class="hidden"></div>
<script src="config.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
